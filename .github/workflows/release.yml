name: Release Obsidian plugin

on:
  # A release is built from the tag "npm version" leaves behind, so that the
  # version of the release is the version the plugin was built with.
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build the release from (created if it is missing)
        required: true

permissions:
  contents: write
  # Attesting a build needs a token of its own, and the attestation itself has
  # to be written down somewhere.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # A version is sometimes committed without a tag to go with it, and then
      # there is nothing for the checkout below to fetch. Such a run builds the
      # head of the default branch instead, and tags it once the build has
      # proven the commit is worth a tag.
      - name: Look the tag up
        id: tag
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "The tag $TAG does not exist yet; building $DEFAULT_BRANCH."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Obsidian looks a release up by the version of the manifest, so a tag
      # naming another one is a release nobody would ever be offered.
      - name: Check the tag against the manifest
        run: |
          version="$(node -p "require('./manifest.json').version")"

          if [ "$TAG" != "$version" ]; then
            echo "The tag ($TAG) is not the version of manifest.json ($version)." >&2
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run the tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # The tag is written down only now, so that a commit which fails to build
      # leaves no tag behind to be confused for a release later. A tag pushed
      # with GITHUB_TOKEN starts no second run of this workflow.
      - name: Tag the build
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$(git rev-parse HEAD)"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --draft \
            main.js manifest.json styles.css
